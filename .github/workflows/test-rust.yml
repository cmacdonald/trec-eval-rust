name: Test Rust

on:
  pull_request:
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  push:
    branches:
      - main
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.75.0", "stable"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Run Rust tests
        run: |
          cargo test --workspace --lib --bins
          cargo test -p te-rust --test confidence_intervals
