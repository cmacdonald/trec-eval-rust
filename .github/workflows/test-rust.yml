name: Test Rust

on:
  pull_request:
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  push:
    branches:
      - main
    paths:
      - "te-rust/**"
      - "te-python/src/**"
      - "te-python/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["1.75.0", "stable"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Check out C trec_eval reference
        if: matrix.rust-version == 'stable'
        uses: actions/checkout@v4
        with:
          repository: usnistgov/trec_eval
          ref: f4253652c8efd0d86ddffd0d163cc0a0f813111a # v10.0
          path: trec_eval

      - name: Run Rust tests
        run: |
          cargo test --workspace --lib --bins --tests -- \
            --skip test_regression_default \
            --skip test_regression_query_level \
            --skip test_regression_judged_only \
            --skip test_regression_max_docs \
            --skip test_regression_relevance_level \
            --skip test_regression_parametric_cutoffs \
            --skip test_regression_stock_set \
            --skip test_regression_help_flags \
            --skip test_regression_specialized_standard_metrics \
            --skip test_regression_relstring_query_level \
            --skip test_regression_group_3 \
            --skip test_regression_group_4 \
            --skip test_regression_group_5_7 \
            --skip test_regression_qrels_jg \
            --skip test_regression_qrels_jg_with_comments

      - name: Run C parity regression tests
        if: matrix.rust-version == 'stable'
        run: |
          make -C trec_eval -j2
          cargo test -p te-rust --test regression
